# Clash Party 与 FlClash 共用的 Mihomo 配置模板。
# 节点不写在这里。chain-mihomo.js 会读取组合订阅「合并」，
# 按已有的「落地-」前缀填入口和出口。请阅读 chain-mihomo-指南.md。不要改策略组名称。

mode: rule
ipv6: false
allow-lan: false
unified-delay: true
tcp-concurrent: true
log-level: warning
profile:
  store-selected: true
  store-fake-ip: true

# 电脑和手机的 TUN、入站端口由各自客户端管理，这里不写。
# FlClash 若打开 DNS 覆写，会盖掉下面这一段。
dns:
  enable: true
  listen: "127.0.0.1:1053"
  ipv6: false
  prefer-h3: false
  use-system-hosts: false
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - "223.5.5.5"
    - "119.29.29.29"
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  fallback:
    - "tls://1.1.1.1"
    - "tls://8.8.8.8"
  fallback-filter:
    geoip: true
    geoip-code: CN
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
  direct-nameserver:
    - "https://223.5.5.5/dns-query"
  direct-nameserver-follow-policy: false
  cache-algorithm: lru

