# 匹配顺序就是书写顺序。用户自定义放在最上面。
rules:
  # 用户自定义。取消注释并改成你的域名；目标只能是已有策略组、DIRECT 或 REJECT。
  # - DOMAIN-SUFFIX,example.com,出口选择
  # - DOMAIN-SUFFIX,example.org,国内与局域网
  - RULE-SET,private,国内与局域网
  - RULE-SET,lan-ip,国内与局域网,no-resolve
  - RULE-SET,ads,广告拦截
  - RULE-SET,ai,AI 服务
  - RULE-SET,social,消息与社交
  - RULE-SET,messaging,消息与社交
  - RULE-SET,media,流媒体与音乐
  - RULE-SET,games-cn,国内与局域网
  - RULE-SET,games,游戏
  - RULE-SET,github,开发与 GitHub
  - RULE-SET,microsoft,微软服务
  - RULE-SET,apple,苹果服务
  - RULE-SET,icloud,苹果服务
  - RULE-SET,google,谷歌服务
  - RULE-SET,bank-cn,金融服务
  - RULE-SET,finance,金融服务
  - RULE-SET,crypto,金融服务
  - RULE-SET,downloads,下载与工具
  - RULE-SET,gfw,默认代理
  - RULE-SET,proxy-list,默认代理
  - RULE-SET,tld-not-cn,默认代理
  - RULE-SET,cn-domain,国内与局域网
  - RULE-SET,cn-ip,国内与局域网,no-resolve
  - RULE-SET,telegram-ip,消息与社交,no-resolve
  - GEOIP,LAN,国内与局域网,no-resolve
  - GEOIP,CN,国内与局域网,no-resolve
  - MATCH,漏网之鱼

proxy-groups:
  - name: "入口选择"
    type: select
    proxies: []
    empty-fallback: REJECT
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    timeout: 5000
    lazy: true

  - name: "出口选择"
    type: select
    proxies: []
    empty-fallback: REJECT
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    timeout: 5000
    lazy: true

  - name: "默认代理"
    type: select
    proxies:
      - "出口选择"
      - "入口选择"
      - DIRECT

  # 下面这些服务组的成员由 chain-mihomo.js 重写：每个组直接列出全部出口节点，默认是第一个出口。
  - name: "AI 服务"
    type: select
    proxies:
      - "出口选择"
      - "入口选择"
      - DIRECT

  - name: "消息与社交"
    type: select
    proxies:
      - "出口选择"
      - "入口选择"
      - DIRECT

  - name: "流媒体与音乐"
    type: select
    proxies:
      - "出口选择"
      - "入口选择"
      - DIRECT

  - name: "游戏"
    type: select
    proxies:
      - "出口选择"
      - "入口选择"
      - DIRECT

  - name: "开发与 GitHub"
    type: select
    proxies:
      - "出口选择"
      - "入口选择"
      - DIRECT

  - name: "微软服务"
    type: select
    proxies:
      - "出口选择"
      - "入口选择"
      - DIRECT

  - name: "苹果服务"
    type: select
    proxies:
      - "出口选择"
      - "入口选择"
      - DIRECT

  - name: "谷歌服务"
    type: select
    proxies:
      - "出口选择"
      - "入口选择"
      - DIRECT

  - name: "金融服务"
    type: select
    proxies:
      - DIRECT
      - "出口选择"
      - "入口选择"

  - name: "广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "下载与工具"
    type: select
    proxies:
      - DIRECT
      - "默认代理"

  - name: "国内与局域网"
    type: select
    proxies:
      - DIRECT
      - "默认代理"

  - name: "漏网之鱼"
    type: select
    proxies:
      - "默认代理"
      - "出口选择"
      - "入口选择"
      - DIRECT
